<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150" role="img" aria-label="Simulae — a multiverse of worlds, each with its own physics">
  <defs>
    <radialGradient id="simbg" cx="72%" cy="45%" r="85%">
      <stop offset="0" stop-color="#241a4e"/><stop offset="60%" stop-color="#140f2e"/><stop offset="100%" stop-color="#0a0720"/>
    </radialGradient>
    <filter id="sglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="830" height="150" fill="url(#simbg)"/>
  <rect x="0.5" y="0.5" width="829" height="149" fill="none" stroke="#8a6bd4" stroke-opacity="0.22"/>

  <!-- the hub + three worlds orbiting -->
  <g transform="translate(632,75)">
    <g fill="none" stroke="#5a4a8f" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1 4">
      <circle r="42"/><circle r="66"/>
    </g>
    <!-- Decided · brass seal -->
    <g transform="translate(42,0)"><circle r="11" fill="#E0A458" opacity="0.35" filter="url(#sglow)"/>
      <path d="M0 -6 l5 3 v6 l-5 3 -5 -3 v-6Z" fill="#1a1230" stroke="#E0A458" stroke-width="1.3"/><circle r="1.6" fill="#f4d9a8"/>
      <text y="22" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.5" fill="#d9b57e" letter-spacing="0.5">decided</text></g>
    <!-- Everwhere · candlelit gilt -->
    <g transform="translate(-30,-30)"><circle r="10" fill="#f2c46b" opacity="0.3" filter="url(#sglow)"/>
      <circle r="5" fill="#f2c46b"/><circle r="1.6" fill="#fff7e6"/>
      <text y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.5" fill="#f0cf92" letter-spacing="0.5">everwhere</text></g>
    <!-- VIVID · prism pink -->
    <g transform="translate(-18,42)"><circle r="10" fill="#FF3D8A" opacity="0.32" filter="url(#sglow)"/>
      <circle r="5" fill="#FF7AB0"/><circle r="1.6" fill="#ffe9f2"/>
      <text y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7.5" fill="#ff9ec4" letter-spacing="0.5">vivid</text></g>
    <!-- hub core -->
    <circle r="3.4" fill="#efeaff"><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <text x="42" y="54" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#efeaff">Simulae <tspan font-style="italic" font-size="18" fill="#b9aee0">— a multiverse of worlds.</tspan></text>
  <text x="42" y="84" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#a99fd0">one hub, many worlds — each with its own physics, laws, and look.</text>
  <text x="42" y="110" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" letter-spacing="0.8" fill="#7d72a8">decide · dream a world into being · fight to keep a memory vivid</text>

  <text x="42" y="136" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" fill="#b58af0" opacity="0.9">simulae.world ↗</text>
</svg>
