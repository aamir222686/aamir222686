<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="830" height="130" role="img" aria-label="The game lab. Vestige in progress, The Long Silence paused, concept four loading.">
<style>
@keyframes breathe {0%,100%{opacity:.3}50%{opacity:1}}
@keyframes loaddots {0%{opacity:.15}25%{opacity:1}100%{opacity:.15}}
.w{animation:breathe 2.6s ease-in-out infinite}
.l1{animation:loaddots 1.8s linear infinite}
.l2{animation:loaddots 1.8s linear .3s infinite}
.l3{animation:loaddots 1.8s linear .6s infinite}
@media (prefers-reduced-motion: reduce){.w,.l1,.l2,.l3{animation:none}}
text{font-family:ui-monospace,'Courier New',monospace}
</style>
<rect width="830" height="130" fill="#05060a"/>
<rect x="8.5" y="8.5" width="813" height="113" fill="none" stroke="#1d2230"/>
<text x="40" y="42" font-size="12" letter-spacing="6" fill="#7a8494">THE LAB</text>
<circle class="w" cx="48" cy="76" r="5" fill="#ff6a2c"/>
<text x="64" y="81" font-size="14" fill="#e8eaf0" font-family="'Inter',Arial,sans-serif" font-weight="600">Vestige</text>
<text x="64" y="101" font-size="11" fill="#7a8494">action-metroidvania · in the forge</text>
<circle cx="318" cy="76" r="5" fill="#ff6a2c" opacity=".35"/>
<text x="334" y="81" font-size="14" fill="#e8eaf0" font-family="'Inter',Arial,sans-serif" font-weight="600">The Long Silence</text>
<text x="334" y="101" font-size="11" fill="#7a8494">action-platformer · resting</text>
<g><circle class="l1" cx="608" cy="76" r="4" fill="#f5b83d"/><circle class="l2" cx="622" cy="76" r="4" fill="#f5b83d"/><circle class="l3" cx="636" cy="76" r="4" fill="#f5b83d"/></g>
<text x="652" y="81" font-size="14" fill="#e8eaf0" font-family="'Inter',Arial,sans-serif" font-weight="600">concept four</text>
<text x="652" y="101" font-size="11" fill="#7a8494">the lab is stocked</text>
</svg>
