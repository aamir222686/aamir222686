<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150" role="img" aria-label="Posy — a calmer place to disagree">
  <rect width="830" height="150" fill="#f5efe0"/>
  <rect x="0.5" y="0.5" width="829" height="149" fill="none" stroke="#66743d" stroke-opacity="0.35"/>
  <rect x="6.5" y="6.5" width="817" height="137" fill="none" stroke="#66743d" stroke-opacity="0.22"/>

  <!-- two stems grow toward the middle -->
  <g fill="none" stroke-linecap="round">
    <path d="M 30 118 C 60 112, 88 98, 112 78" stroke="#66743d" stroke-width="2.2" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;0;0;120" keyTimes="0;0.3;0.85;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 196 118 C 166 112, 138 98, 116 79" stroke="#8c4a52" stroke-width="2.2" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" values="120;0;0;120" keyTimes="0;0.3;0.85;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <!-- leaves -->
    <path d="M 62 111 q 8 -12 20 -12 q -4 14 -20 12 z" fill="#66743d" fill-opacity="0.85" stroke="none">
      <animate attributeName="fill-opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.22;0.32;0.85;1" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 164 111 q -8 -12 -20 -12 q 4 14 20 12 z" fill="#8c4a52" fill-opacity="0.7" stroke="none">
      <animate attributeName="fill-opacity" values="0;0;0.7;0.7;0" keyTimes="0;0.22;0.32;0.85;1" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- the shared bloom where they meet -->
  <g transform="translate(114,66)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0;0;1;1;0" keyTimes="0;0.3;0.42;0.85;1" dur="10s" repeatCount="indefinite" additive="sum"/>
      <g fill="#c98a99">
        <ellipse cx="0" cy="-13" rx="6" ry="11"/>
        <ellipse cx="11.3" cy="-6.5" rx="6" ry="11" transform="rotate(60)"/>
        <ellipse cx="11.3" cy="6.5" rx="6" ry="11" transform="rotate(120)"/>
        <ellipse cx="0" cy="13" rx="6" ry="11" transform="rotate(180)"/>
        <ellipse cx="-11.3" cy="6.5" rx="6" ry="11" transform="rotate(240)"/>
        <ellipse cx="-11.3" cy="-6.5" rx="6" ry="11" transform="rotate(300)"/>
      </g>
      <circle r="5.5" fill="#d9b65c"/>
    </g>
  </g>

  <!-- copy, botanical-plate typography -->
  <text x="258" y="56" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#33392b">Posy <tspan font-style="italic" font-size="19" fill="#5b6247">, a calmer place to disagree.</tspan></text>
  <text x="258" y="86" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#6d7457">disagreement goes in, a garden comes out. the gardener names the crux,</text>
  <text x="258" y="107" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#6d7457">shows each side at its strongest, and never picks a winner.</text>
  <text x="258" y="131" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" letter-spacing="1.5" fill="#8c4a52">BRIDGES BUILT, NOT FOLLOWERS &#183; &#10059;</text>

  <text x="806" y="134" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" fill="#66743d">posy.gift &#8599;</text>
</svg>
