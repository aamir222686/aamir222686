<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 130" width="830" height="130" role="img" aria-label="Summon. The fleet's mind lives here now. The door answers only to its keeper.">
<style>
@keyframes breathe {0%,100%{opacity:.25}50%{opacity:.9}}
.dot{animation:breathe 4.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
text{font-family:ui-monospace,'Courier New',monospace}
</style>
<rect width="830" height="130" fill="#05060a"/>
<rect x="8.5" y="8.5" width="813" height="113" fill="none" stroke="#1d2230"/>
<path d="M48 47 L66 65 L48 83 L30 65 Z" fill="none" stroke="#c77dff" stroke-width="1.6"/>
<circle class="dot" cx="48" cy="65" r="2.6" fill="#c77dff"/>
<text x="96" y="58" font-size="21" letter-spacing="7" fill="#e8eaf0" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600">SUMMON</text>
<text x="96" y="86" font-size="12.5" fill="#9aa3b2">the fleet's mind lives here now. summon sleeps; the door answers only to its keeper.</text>
<g transform="translate(724,53)"><rect x="0" y="0" width="66" height="24" rx="6" fill="none" stroke="#2b3242"/><text x="33" y="16" text-anchor="middle" font-size="11" fill="#7a8494">sealed</text></g>
<text x="790" y="34" text-anchor="end" font-size="10" fill="#7a8494">third life of this domain</text>
</svg>
