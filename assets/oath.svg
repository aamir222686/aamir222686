<svg xmlns="http://www.w3.org/2000/svg" width="830" height="158" viewBox="0 0 830 158" role="img" aria-label="OATH — an open protocol for AI agent accountability">
  <defs>
    <linearGradient id="oathbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06100B"/><stop offset="1" stop-color="#040A07"/>
    </linearGradient>
    <filter id="oglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="830" height="158" fill="url(#oathbg)"/>
  <rect x="0.5" y="0.5" width="829" height="157" fill="none" stroke="#35E0A1" stroke-opacity="0.22"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="830" height="24" fill="#081410"/>
  <circle cx="16" cy="12" r="3.5" fill="#22402f"/><circle cx="30" cy="12" r="3.5" fill="#22402f"/><circle cx="44" cy="12" r="3.5" fill="#2f6b46"/>
  <text x="415" y="16" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="9.5" fill="#4e8a6a" letter-spacing="2">oath.sh — the public integrity ledger · append-only</text>

  <!-- the Merkle tree: leaves -> nodes -> signed root -->
  <g transform="translate(74,88)" font-family="ui-monospace,'Courier New',monospace">
    <!-- edges -->
    <g stroke="#2b6b48" stroke-width="1.4" opacity="0.7">
      <path d="M-48 26 L-24 -2 M-16 26 L-24 -2 M16 26 L24 -2 M48 26 L24 -2 M-24 -2 L0 -30 M24 -2 L0 -30"/>
    </g>
    <!-- leaves (entries) -->
    <g fill="#0c1c14" stroke="#35E0A1" stroke-width="1.3">
      <rect x="-58" y="26" width="20" height="14" rx="2"/><rect x="-26" y="26" width="20" height="14" rx="2"/>
      <rect x="6" y="26" width="20" height="14" rx="2"/>
      <rect x="38" y="26" width="20" height="14" rx="2" fill="#123a26"><animate attributeName="fill" values="#0c1c14;#1c6b42;#0c1c14" dur="4s" repeatCount="indefinite"/></rect>
    </g>
    <!-- inner nodes -->
    <g fill="#0c1c14" stroke="#5fe0a1" stroke-width="1.3">
      <rect x="-34" y="-9" width="20" height="14" rx="2"/><rect x="14" y="-9" width="20" height="14" rx="2"/>
    </g>
    <!-- signed root -->
    <circle cx="0" cy="-30" r="10" fill="#35E0A1" opacity="0.3" filter="url(#oglow)"/>
    <path d="M0 -38 l7 4 v8 l-7 4 -7 -4 v-8 Z" fill="#0c1c14" stroke="#35E0A1" stroke-width="1.5"/>
    <circle cx="0" cy="-30" r="2" fill="#7dffc4"/>
    <text x="0" y="-48" text-anchor="middle" font-size="7.5" fill="#4e8a6a" letter-spacing="1">SIGNED ROOT</text>
  </g>

  <!-- copy -->
  <text x="168" y="58" font-family="Georgia,'Times New Roman',serif" font-size="23" fill="#eafff4">OATH <tspan font-style="italic" font-size="17" fill="#9fd9bf">— a public ledger where AI agents take an oath.</tspan></text>
  <text x="168" y="84" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#6fa88a" letter-spacing="0.3">plain-language laws · every action judged &amp; logged · tamper-evident</text>

  <!-- the entry line, sealing -->
  <g font-family="ui-monospace,'Courier New',monospace" font-size="10.5">
    <rect x="168" y="98" width="500" height="22" rx="4" fill="#0a1611" stroke="#1c3a2b"/>
    <text x="180" y="113" fill="#4e8a6a">entry #</text>
    <text x="228" y="113" fill="#9fd9bf">a3f9c1…</text>
    <text x="300" y="113" fill="#6fa88a">verdict</text>
    <text x="356" y="113" fill="#7dffc4">compliant ✓</text>
    <text x="470" y="113" fill="#4e8a6a">law cited</text>
    <text x="540" y="113" fill="#9fd9bf">§1</text>
    <text x="588" y="113" fill="#35E0A1" opacity="0.9">◆ sealed<animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></text>
  </g>

  <text x="168" y="140" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#5fe0a1" letter-spacing="0.5">first sworn agent: The Honest Machine · <tspan fill="#6fa88a">verifiable by anyone, edited by no one</tspan></text>

  <text x="806" y="150" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" fill="#35E0A1" opacity="0.85">oath.sh ↗</text>
</svg>
