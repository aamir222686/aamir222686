<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150" role="img" aria-label="Summon — don't install apps, type one into existence">
  <defs>
    <linearGradient id="smbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="smtype"><rect x="70" y="46" width="0" height="22"><animate attributeName="width" values="0;0;250;250;250" keyTimes="0;0.05;0.35;0.95;1" dur="11s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="panelclip"><rect x="452" y="30" width="300" height="92" rx="12"/></clipPath>
  </defs>

  <rect width="830" height="150" fill="url(#smbg)"/>
  <rect x="0.5" y="0.5" width="829" height="149" fill="none" stroke="#7dd3fc" stroke-opacity="0.2"/>

  <!-- the wish, typed -->
  <text x="70" y="63" font-family="ui-monospace,'Courier New',monospace" font-size="15" fill="#bfe9ff" clip-path="url(#smtype)">&#8220;a tiny app that helps me breathe&#8221;</text>
  <rect x="70" y="49" width="8" height="18" fill="#7dd3fc">
    <animate attributeName="x" values="70;70;320;320;320" keyTimes="0;0.05;0.35;0.95;1" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="95" font-family="Georgia,'Times New Roman',serif" font-size="21" fill="#e9f4fb">Summon <tspan font-style="italic" font-size="17" fill="#9db8cc">&#8212; don&#8217;t install apps, type one into existence.</tspan></text>
  <text x="70" y="120" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#5f7d95">a living-glass desktop made of your words</text>

  <!-- the summoned panel materializes -->
  <g>
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.3;0.36;0.48;0.95;1" dur="11s" repeatCount="indefinite"/>
    <rect x="452" y="30" width="300" height="92" rx="12" fill="url(#glass)" stroke="#7dd3fc" stroke-opacity="0.55"/>
    <rect x="452" y="30" width="300" height="24" rx="12" fill="#7dd3fc" opacity="0.12"/>
    <circle cx="468" cy="42" r="3.5" fill="#7dd3fc" opacity="0.7"/>
    <text x="482" y="46" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#a8dcfa" letter-spacing="1">breathe.app &#183; summoned just now</text>
    <!-- breathing circle inside the summoned app -->
    <circle cx="520" cy="88" r="14" fill="none" stroke="#7dd3fc" stroke-width="2">
      <animate attributeName="r" values="10;18;10" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0.35;0.9" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="556" y="84" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#bfe9ff">in&#160;&#160;&#8212;&#160;&#160;4s</text>
    <text x="556" y="101" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#7fa3bd">out &#8212; 6s</text>
    <!-- sheen sweep -->
    <g clip-path="url(#panelclip)">
      <rect x="392" y="20" width="90" height="120" fill="url(#sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="380;800" keyTimes="0;1" dur="11s" begin="-4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="806" y="140" text-anchor="end" font-family="ui-monospace,'Courier New',monospace" font-size="10.5" fill="#7dd3fc" opacity="0.8">summon.today &#8599;</text>
</svg>
